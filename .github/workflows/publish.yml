name: Publish distribution to PyPI

on:
  push:
    tags: ["*"]  # every tag is a release; the tag is the version setuptools_scm reads, e.g. 0.2.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Releases come from the upstream repository only.  The guard on every job
# means a tag pushed to a fork runs nothing: no build, no contact with PyPI.
jobs:
  build:
    name: Build distribution
    if: github.repository == 'mpi-astronomy/snowblind'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs the tags for the version
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: python -m pip install --upgrade build
      - name: Build a wheel and a source tarball
        run: python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Extract the release notes from the changelog
        # fails the build, before anything is published, when CHANGES.md has no section for the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release_notes.md
      - name: Store the release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release_notes.md

  publish-to-pypi:
    name: Publish distribution to PyPI
    if: github.repository == 'mpi-astronomy/snowblind' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/snowblind
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        # trusted publishing; the action also generates PEP 740 attestations, which PyPI
        # stores and shows as provenance, so the files on PyPI are signed
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: Create the GitHub release with the changelog section as its notes
    if: github.repository == 'mpi-astronomy/snowblind'
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mandatory for making GitHub releases
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
      - name: Create the GitHub release with the changelog section as its notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' > /dev/null 2>&1
          || gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}'
          --title '${{ github.ref_name }}' --notes-file release_notes.md
      - name: Upload the dists to the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}'
